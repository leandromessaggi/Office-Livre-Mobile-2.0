plugins { id 'com.android.application' }

android {
    namespace 'com.officelivre.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.officelivre.mobile'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

// Leitura dos índices/bookmarks internos de PDFs, sem necessidade de conexão no aplicativo.
dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
