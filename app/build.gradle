plugins { id 'com.android.application' }

android {
    namespace 'com.officelivre.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.officelivre.mobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
